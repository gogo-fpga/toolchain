# Dependabot が取得できる依存の更新を週次で確認します。
# libftdi は developer.intra2net.com に Dependabot が接続できないため、固定版確認ワークフローで監視します。
version: 2
updates:
  # Dependabot が取得できる branch submodule を対象にします。
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    allow:
      # dependency-name は .gitmodules の path と一致させます。
      - dependency-name: "vendor/yomiyasu"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # タグで固定した submodule は Dependabot が branch HEAD に進めないよう対象外です。
  # openFPGALoader、libusb、zlib、emsdk、Yosys、wasi-sdk は固定版確認ワークフローで監視します。
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/tests/fixtures"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
