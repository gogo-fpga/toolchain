      - name: Yosys WASM artifact を取得
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-yosys-synth-${{ github.run_id }}
          path: build/wasi/yosys

      - name: nextpnr artifacts を取得
